# TastePilot API — https://docs.railway.app/reference/config-as-code
[env]
PYTHONPATH = "src"

[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements-api.txt"

[deploy]
# Shell wrapper required: Railway runs startCommand in exec form ($PORT won't expand otherwise)
startCommand = "sh -c 'uvicorn app.api.app:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
